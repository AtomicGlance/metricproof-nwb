name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MetricProof 0.2 candidate
        run: >-
          python -m pip install
          "metricproof @ git+https://github.com/AtomicGlance/metricproof.git@41b3ef81e421c23c5923cbf4c35f505cfae5b9bf"
      - name: Install package
        run: python -m pip install ".[dev]"
      - name: Run linting
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: metricproof-nwb --version
